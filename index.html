<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .card {
            width: 100%;
            max-width: 420px;
            margin: 1.5rem;
            padding: 2rem;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 1.5rem;
            font-size: 1.75rem;
            text-align: center;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        input,
        select,
        button {
            font: inherit;
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            border: 1px solid #d1d5db;
        }

        button {
            width: 100%;
            margin-top: 0.5rem;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 1.25rem;
            min-height: 1.5rem;
            text-align: center;
            line-height: 1.6;
        }

        #result.error {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tip Calculator</h1>
        <div class="field">
            <label for="billAmount">Bill Amount</label>
            <input type="number" id="billAmount" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="field">
            <label for="tipPercentage">Tip Percentage</label>
            <select id="tipPercentage">
                <option value="10">10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
            </select>
        </div>
        <div class="field">
            <label for="numberOfPeople">Number of People</label>
            <input type="number" id="numberOfPeople" placeholder="1" min="1" step="1">
        </div>
        <button id="calculate">Calculate</button>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
